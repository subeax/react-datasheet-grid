name: CI
on:
  push:
    branches: [master, subeax-maintained]
  pull_request:
    branches: [master, subeax-maintained]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm pack --dry-run
